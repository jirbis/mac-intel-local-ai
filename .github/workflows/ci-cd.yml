name: Intel macOS CI/CD

# Heavy jobs run after a successful merge, or manually. Never build a PR head
# under pull_request_target: only the already-merged commit on main is trusted.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Check without publishing, or publish a stable release
        type: choice
        options: [check, stable]
        default: check
      version:
        description: Stable release version (X.Y.Z, required for stable)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      channel: ${{ steps.plan.outputs.channel }}
      digest: ${{ steps.package.outputs.digest }}
    steps:
      - name: Plan
        id: plan
        shell: bash
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REQUEST_CHANNEL: ${{ inputs.channel }}
          REQUEST_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          channel="$REQUEST_CHANNEL"
          version="1.0"
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request_target ]]; then
            sha="$MERGED_SHA"
            channel=dev
            tag="dev-$GITHUB_RUN_ID"
          elif [[ "$channel" == stable ]]; then
            [[ "$REQUEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Stable version must be X.Y.Z"; exit 1; }
            version="$REQUEST_VERSION"
            tag="v$version"
          elif [[ "$channel" != check ]]; then
            exit 1
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.plan.outputs.sha }}
          persist-credentials: false
      - name: Verify trusted revision and toolchain
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -m)" = x86_64
          swiftc --version
          zsh -n build.sh
          python3 -m py_compile examples/active_server.py
      - name: Build and verify app
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          app="build/Mac Intel Local AI.app"
          test "$(lipo -archs "$app/Contents/MacOS/MacIntelLocalAI")" = x86_64
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = "$APP_BUILD_NUMBER"
          codesign --verify --deep --strict "$app"
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/Mac Intel Local AI.app" dist/MacIntelLocalAI-macos-x86_64.zip
          cd dist
          shasum -a 256 MacIntelLocalAI-macos-x86_64.zip > SHA256SUMS
          echo "digest=$(shasum -a 256 SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ needs.build.outputs.channel == 'dev' || needs.build.outputs.channel == 'stable' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Publication is serialized, and never executes repository code.
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-x86_64
          path: dist
      - name: Verify artifact integrity
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cd dist
          test "$(sha256sum SHA256SUMS | cut -d ' ' -f 1)" = "$EXPECTED_DIGEST"
          sha256sum -c SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          set -euo pipefail
          # Do not silently reuse a tag pointing at another revision.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          flags=()
          if [[ "$CHANNEL" == dev ]]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_SHA" \
            --title "Mac Intel Local AI $RELEASE_TAG" \
            --notes "Intel macOS build from $RELEASE_SHA. Ad-hoc signed, not notarized; backends and models are not bundled." \
            "${flags[@]}" \
            dist/MacIntelLocalAI-macos-x86_64.zip dist/SHA256SUMS
